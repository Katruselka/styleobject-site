<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Loading... | STYLE OBJECT</title>
  <meta id="meta-description" name="description" content="">
  <meta id="meta-keywords" name="keywords" content="">
  <meta id="og-title" property="og:title" content="">
  <meta id="og-description" property="og:description" content="">
  <meta id="og-image" property="og:image" content="">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #faf6ee; color: #2a2420; line-height: 1.6; font-weight: 300; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    
    .header { padding: 24px 0; border-bottom: 1px solid rgba(42,36,32,0.1); background: #faf6ee; position: sticky; top: 0; z-index: 100; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400; letter-spacing: 4px; color: #2a2420; text-decoration: none; }
    .nav { display: flex; gap: 28px; }
    .nav a { color: #5c4a3a; text-decoration: none; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
    .nav a:hover { color: #2a2420; }
    
    .loading { text-align: center; padding: 120px 24px; color: #5c4a3a; font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; }
    
    /* HERO - constrained max width and height */
    .look-hero { padding: 60px 24px 60px; text-align: center; max-width: 800px; margin: 0 auto; }
    .look-category { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8a7464; margin-bottom: 24px; }
    .look-title { font-family: 'Fraunces', serif; font-size: clamp(36px, 5vw, 56px); font-weight: 400; line-height: 1.1; margin-bottom: 12px; letter-spacing: -1px; }
    .look-title em { font-style: italic; color: #5c4a3a; }
    .look-subtitle { font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; color: #5c4a3a; margin-bottom: 40px; }
    .look-hero-image {
      max-width: 500px;
      max-height: 700px;
      margin: 0 auto;
      border-radius: 4px;
      overflow: hidden;
      aspect-ratio: 4/5;
    }
    .look-hero-image img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
      display: block; 
    }
    .look-story { 
      max-width: 600px; 
      margin: 40px auto 0; 
      font-size: 16px; 
      line-height: 1.8; 
      color: #3a312a; 
      font-weight: 300; 
    }
    
    /* PRODUCTS SECTION */
    .products-section { padding: 80px 0; border-top: 1px solid rgba(42,36,32,0.1); }
    .section-title { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 400; margin-bottom: 48px; text-align: center; letter-spacing: -0.5px; }
    .section-title em { font-style: italic; color: #5c4a3a; }
    
    /* Auto-fit grid: works beautifully for 1, 2, 3, or more products */
    .products-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
      gap: 32px; 
      justify-content: center;
    }
    .product-card { 
      background: #fff; 
      border-radius: 4px; 
      overflow: hidden; 
      transition: transform 0.3s, box-shadow 0.3s; 
      text-decoration: none; 
      color: inherit; 
      display: block;
      max-width: 320px;
    }
    .product-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 32px rgba(42,36,32,0.08); 
    }
    .product-image { 
      aspect-ratio: 1; 
      overflow: hidden; 
      background: #f5f0e8; 
    }
    .product-image img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block; 
    }
    .product-info { padding: 24px; }
    .product-category { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a7464; margin-bottom: 8px; }
    .product-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 400; margin-bottom: 8px; line-height: 1.3; }
    .product-description { font-size: 14px; color: #5c4a3a; line-height: 1.5; margin-bottom: 16px; }
    .product-price-row { display: flex; justify-content: space-between; align-items: center; }
    .product-price { font-family: 'Fraunces', serif; font-size: 18px; color: #2a2420; }
    .product-shop { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #5c4a3a; }
    
    /* TIPS SECTION */
    .tips-section { padding: 80px 24px; background: #f5f0e8; }
    .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 48px; max-width: 1000px; margin: 0 auto; }
    .tip { text-align: center; }
    .tip-label { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; color: #5c4a3a; margin-bottom: 16px; }
    .tip-text { font-size: 15px; line-height: 1.7; color: #3a312a; }
    
    .disclosure { padding: 40px 24px; text-align: center; font-size: 12px; color: #8a7464; font-style: italic; max-width: 600px; margin: 0 auto; }
    
    .footer { padding: 48px 0 32px; text-align: center; background: #2a2420; color: #faf6ee; }
    .footer-logo { font-family: 'Fraunces', serif; font-size: 22px; letter-spacing: 4px; margin-bottom: 16px; }
    .footer-links { display: flex; gap: 24px; justify-content: center; margin-bottom: 24px; }
    .footer-links a { color: #faf6ee; text-decoration: none; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.8; }
    .footer-links a:hover { opacity: 1; }
    .footer-copy { font-size: 11px; color: #8a7464; letter-spacing: 1px; }
    
    .error { padding: 120px 24px; text-align: center; }
    .error h1 { font-family: 'Fraunces', serif; font-size: 32px; margin-bottom: 16px; }
    .error a { color: #5c4a3a; text-decoration: underline; }
    
    @media (max-width: 768px) {
      .nav { gap: 16px; }
      .nav a { font-size: 12px; }
      .look-hero { padding: 40px 24px 40px; }
      .look-hero-image { max-width: 100%; max-height: 500px; }
      .products-section { padding: 48px 0; }
      .tips-section { padding: 48px 24px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo">STYLE · OBJECT</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/looks/">All Looks</a>
    </nav>
  </div>
</header>

<main>
  <div id="loading" class="loading">Loading look...</div>
  <div id="content" style="display:none;">
    <section class="look-hero">
      <div id="category" class="look-category"></div>
      <h1 id="title" class="look-title"></h1>
      <p id="subtitle" class="look-subtitle"></p>
      <div class="look-hero-image"><img id="hero-image" src="" alt=""></div>
      <p id="story" class="look-story"></p>
    </section>
    
    <section class="products-section">
      <div class="container">
        <h2 class="section-title">Shop the <em>Look</em></h2>
        <div id="products-grid" class="products-grid"></div>
      </div>
    </section>
    
    <section class="tips-section">
      <h2 class="section-title">Styling <em>Notes</em></h2>
      <div id="tips-grid" class="tips-grid"></div>
    </section>
    
    <p class="disclosure">As an Amazon Associate, I earn from qualifying purchases. This means I may receive a small commission at no extra cost to you.</p>
  </div>
  
  <div id="error" class="error" style="display:none;">
    <h1>Look not found</h1>
    <p><a href="/">← Back to home</a></p>
  </div>
</main>

<footer class="footer">
  <div class="footer-logo">STYLE · OBJECT</div>
  <div class="footer-links">
    <a href="/">Home</a>
    <a href="/looks/">All Looks</a>
  </div>
  <div class="footer-copy">© 2026 STYLE OBJECT</div>
</footer>

<script>
function getSlug() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('slug')) return params.get('slug');
  const path = window.location.pathname;
  const match = path.match(/\/looks\/([^\/]+)\/?$/);
  if (match && match[1] !== 'index.html' && match[1] !== '') return match[1];
  return null;
}

async function loadLook() {
  const slug = getSlug();
  if (!slug) { showError(); return; }
  try {
    const response = await fetch(`/looks/data/${slug}.json`);
    if (!response.ok) throw new Error('Not found');
    const data = await response.json();
    if (!data.published) { showError(); return; }
    renderLook(data);
  } catch (e) {
    console.error(e);
    showError();
  }
}

function renderLook(data) {
  document.getElementById('page-title').textContent = data.title + ' | STYLE OBJECT';
  document.getElementById('meta-description').setAttribute('content', data.meta_description || '');
  document.getElementById('meta-keywords').setAttribute('content', data.keywords || '');
  document.getElementById('og-title').setAttribute('content', data.title);
  document.getElementById('og-description').setAttribute('content', data.meta_description || '');
  document.getElementById('og-image').setAttribute('content', data.hero_image || '');
  
  const categoryLabels = {
    'summer-essentials': 'Summer Essentials',
    'quiet-mornings': 'Quiet Mornings',
    'golden-hour': 'Golden Hour',
    'the-weekend': 'The Weekend',
    'coastal-edit': 'Coastal Edit',
    'evening-soft': 'Evening Soft',
    'office-quiet': 'Office Quiet',
    'the-edit': 'The Edit'
  };
  document.getElementById('category').textContent = categoryLabels[data.category] || data.category;
  
  const titleParts = data.title.split(' ');
  const lastWord = titleParts.pop();
  document.getElementById('title').innerHTML = titleParts.join(' ') + ' <em>' + lastWord + '</em>';
  document.getElementById('subtitle').textContent = data.subtitle || '';
  document.getElementById('hero-image').setAttribute('src', data.hero_image || '');
  document.getElementById('hero-image').setAttribute('alt', data.title);
  document.getElementById('story').textContent = data.story || '';
  
  const productsHtml = (data.products || []).map(p => `
    <a href="${p.amazon_link}" target="_blank" rel="noopener noreferrer sponsored" class="product-card">
      <div class="product-image"><img src="${p.image}" alt="${p.name}"></div>
      <div class="product-info">
        <div class="product-category">${p.category_label || ''}</div>
        <h3 class="product-name">${p.name}</h3>
        <p class="product-description">${p.description || ''}</p>
        <div class="product-price-row">
          <span class="product-price">$${p.price}</span>
          <span class="product-shop">Shop on Amazon →</span>
        </div>
      </div>
    </a>
  `).join('');
  document.getElementById('products-grid').innerHTML = productsHtml;
  
  const tipsHtml = (data.styling_tips || []).map(t => `
    <div class="tip">
      <h3 class="tip-label">${t.label}</h3>
      <p class="tip-text">${t.text}</p>
    </div>
  `).join('');
  document.getElementById('tips-grid').innerHTML = tipsHtml;
  
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
}

loadLook();
</script>

</body>
</html>
