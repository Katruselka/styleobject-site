<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Looks | STYLE OBJECT</title>
  <meta name="description" content="Quiet luxury outfit edits. Summer 2026 looks with Amazon finds — linen dresses, woven sandals, structured bags and more.">
  
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #faf6ee; color: #2a2420; font-weight: 300; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    
    .header {
      padding: 24px 0;
      border-bottom: 1px solid rgba(42,36,32,0.1);
      background: #faf6ee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: #2a2420;
      text-decoration: none;
    }
    .nav { display: flex; gap: 28px; }
    .nav a {
      color: #5c4a3a;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    .page-eyebrow {
      text-align: center;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8a7464;
      padding: 64px 24px 12px;
    }
    .page-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 400;
      text-align: center;
      padding: 0 24px;
      letter-spacing: -1px;
    }
    .page-title em { font-style: italic; color: #5c4a3a; }
    .page-subtitle {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 17px;
      text-align: center;
      color: #5c4a3a;
      padding: 16px 24px 48px;
    }
    
    .filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 24px 48px;
    }
    .filter-chip {
      padding: 8px 18px;
      border: 1px solid rgba(42,36,32,0.2);
      border-radius: 100px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #5c4a3a;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip:hover {
      border-color: #2a2420;
      color: #2a2420;
    }
    .filter-chip.active {
      background: #2a2420;
      color: #faf6ee;
      border-color: #2a2420;
    }
    
    .looks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      padding-bottom: 80px;
    }
    .look-card {
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.3s;
    }
    .look-card:hover { transform: translateY(-4px); }
    .look-card-image {
      aspect-ratio: 4/5;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 16px;
      background: #f5f0e8;
    }
    .look-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s;
    }
    .look-card:hover img { transform: scale(1.05); }
    .look-card-category {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #8a7464;
      margin-bottom: 8px;
    }
    .look-card-title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .look-card-title em { font-style: italic; color: #5c4a3a; }
    .look-card-subtitle {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 14px;
      color: #5c4a3a;
    }
    
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: #5c4a3a;
      font-family: 'Fraunces', serif;
      font-style: italic;
    }
    
    .footer {
      padding: 48px 0 32px;
      text-align: center;
      background: #2a2420;
      color: #faf6ee;
    }
    .footer-logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .footer-copy { font-size: 11px; color: #8a7464; letter-spacing: 1px; }
    
    @media (max-width: 768px) {
      .nav { gap: 16px; }
      .nav a { font-size: 11px; }
      .logo { font-size: 18px; letter-spacing: 3px; }
      .filter-chip { padding: 6px 14px; font-size: 11px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo">STYLE · OBJECT</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/looks/">All Looks</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-eyebrow" id="page-eyebrow">The Archive</div>
  <h1 class="page-title" id="page-title">All <em>Looks</em></h1>
  <p class="page-subtitle" id="page-subtitle">Curated edits · Summer 2026</p>
  
  <div class="container">
    <div id="filter-bar" class="filter-bar"></div>
    <div id="looks-grid" class="looks-grid"></div>
    <div id="empty" class="empty" style="display:none;">
      No looks in this category yet.
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-logo">STYLE · OBJECT</div>
  <div class="footer-copy">© 2026 STYLE OBJECT · Amazon Associate</div>
</footer>

<script>
const CATEGORY_LABELS = {
  'summer-essentials': 'Summer Essentials',
  'quiet-mornings': 'Quiet Mornings',
  'golden-hour': 'Golden Hour',
  'the-weekend': 'The Weekend',
  'coastal-edit': 'Coastal Edit',
  'evening-soft': 'Evening Soft',
  'office-quiet': 'Office Quiet',
  'the-edit': 'The Edit'
};

const GITHUB_API = 'https://api.github.com/repos/Katruselka/styleobject-site/contents/looks/data';

let allLooks = [];

function getActiveCategory() {
  const params = new URLSearchParams(window.location.search);
  return params.get('category') || 'all';
}

async function loadAllLooks() {
  try {
    const response = await fetch(GITHUB_API);
    const files = await response.json();
    
    if (!Array.isArray(files) || files.length === 0) {
      showEmpty();
      return;
    }
    
    const looks = await Promise.all(
      files
        .filter(f => f.name.endsWith('.json'))
        .map(f => fetch(f.download_url).then(r => r.json()).catch(() => null))
    );
    
    allLooks = looks
      .filter(l => l && l.published)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    
    if (allLooks.length === 0) {
      showEmpty();
      return;
    }
    
    renderFilters();
    renderLooks();
    updatePageTitle();
  } catch (e) {
    console.error(e);
    showEmpty();
  }
}

function renderFilters() {
  const activeCategory = getActiveCategory();
  const counts = {};
  allLooks.forEach(l => {
    counts[l.category] = (counts[l.category] || 0) + 1;
  });
  
  const filtersHtml = ['all'].concat(Object.keys(counts)).map(cat => {
    const label = cat === 'all' ? 'All' : CATEGORY_LABELS[cat] || cat;
    const isActive = cat === activeCategory ? 'active' : '';
    const url = cat === 'all' ? '/looks/' : `/looks/?category=${cat}`;
    return `<a href="${url}" class="filter-chip ${isActive}">${label}</a>`;
  }).join('');
  
  document.getElementById('filter-bar').innerHTML = filtersHtml;
}

function renderLooks() {
  const activeCategory = getActiveCategory();
  const filtered = activeCategory === 'all' 
    ? allLooks 
    : allLooks.filter(l => l.category === activeCategory);
  
  if (filtered.length === 0) {
    document.getElementById('looks-grid').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  
  document.getElementById('empty').style.display = 'none';
  
  const html = filtered.map(l => {
    const titleParts = l.title.split(' ');
    const lastWord = titleParts.pop();
    const titleHtml = titleParts.length > 0
      ? titleParts.join(' ') + ' <em>' + lastWord + '</em>'
      : '<em>' + lastWord + '</em>';
    
    return `
      <a href="/looks/${l.slug}" class="look-card">
        <div class="look-card-image">
          <img src="${l.hero_image}" alt="${l.title}" loading="lazy">
        </div>
        <div class="look-card-category">${CATEGORY_LABELS[l.category] || l.category}</div>
        <h3 class="look-card-title">${titleHtml}</h3>
        <p class="look-card-subtitle">${l.subtitle || ''}</p>
      </a>
    `;
  }).join('');
  
  document.getElementById('looks-grid').innerHTML = html;
}

function updatePageTitle() {
  const activeCategory = getActiveCategory();
  if (activeCategory !== 'all') {
    const label = CATEGORY_LABELS[activeCategory] || activeCategory;
    document.getElementById('page-eyebrow').textContent = 'Category';
    document.getElementById('page-title').innerHTML = label.split(' ').slice(0, -1).join(' ') + ' <em>' + label.split(' ').slice(-1)[0] + '</em>';
    document.title = label + ' | STYLE OBJECT';
  }
}

function showEmpty() {
  document.getElementById('empty').style.display = 'block';
}

loadAllLooks();
</script>

</body>
</html>
